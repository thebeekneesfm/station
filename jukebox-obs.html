<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex">
<title>The Jukebox (stream screen) · The Bee's Knees.fm</title>
<!-- THE JUKEBOX STREAM SCREEN
     An OBS Browser source, 1920 x 1080, with "Control audio via OBS" ticked so the music goes through OBS.
       https://thebeesknees.fm/jukebox-obs.html?dj=YOUR-SECRET
     The secret is any long made-up word; use the same one in the control panel's address (jukebox-dj.html?dj=...).
     Without it the screen still runs and takes requests, but nothing can approve or skip them.
     Other things to add after the secret (each starts with &):
       &auto=1    requests play without waiting for the DJ to approve them (otherwise they wait in the control panel)
       &fill=1    when nobody has asked for anything, the jukebox picks songs itself
     While this screen is running, the website's jukebox page is open for requests; close the screen (or switch
     "Taking requests" off in the control panel) and the website page closes.
     The look is the Record Shelf's: wallpaper, newsprint, a card book of jukebox title strips that flips through the
     albums, the shelf along the bottom, and Now playing on the right. When a request goes in line, its album pops
     up in the middle with the record spinning. -->
<link rel="stylesheet" href="art/fonts/fonts.css?v=20261101s2">
<script src="art/backgrounds/backgrounds.js?v=20261101g3"></script>
<style>
:root { --paper: #e9e1c9; --ink: #1f1b17; --ink2: #4a4036; --dim: #6b5f50; --red: #c8321f; --honey: #e3a92f; }
* { box-sizing: border-box; margin: 0; }
[hidden] { display: none !important; }
html, body { width: 1920px; height: 1080px; overflow: hidden; }
body { position: relative; color: var(--ink); font-family: "BK Serif", Georgia, serif;
  background: linear-gradient(var(--wall-shade, rgba(20,15,10,.25)), var(--wall-shade, rgba(20,15,10,.25))), var(--wall-img, url("art/wallpaper.jpg")) 0 0 / var(--wall-size, 700px) repeat, #3f5a46; }
.paper { background: url("art/newsprint.jpg") 0 0 / 640px 640px, var(--paper); box-shadow: 0 3px 0 rgba(0,0,0,.28), 0 14px 30px rgba(0,0,0,.3); }

/* masthead */
.mast { position: absolute; left: 60px; top: 36px; width: 1120px; height: 116px; padding: 0 34px; display: flex; align-items: center; gap: 22px; transform: rotate(-.3deg); }
.mast img { height: 92px; }
.mast h1 { font: 700 60px/1 "BK Script", serif; word-spacing: .15em; }
.mast .sub { font: italic 24px/1 "BK Serif", serif; color: var(--red); margin-top: 6px; }
.mast p { margin-left: auto; text-align: right; font-size: 24px; line-height: 1.25; color: var(--ink2); font-style: italic; }
.mast p b { display: block; font-style: normal; color: var(--red); font-size: 30px; }

/* the card book: one album to a spread */
.book { position: absolute; left: 60px; top: 186px; width: 1120px; height: 660px; perspective: 2600px; }
.pg { position: absolute; top: 0; width: 560px; height: 660px; overflow: hidden; }
.pg.l { left: 0; box-shadow: inset -26px 0 30px -20px rgba(60,40,20,.45); }
.pg.r { left: 560px; box-shadow: inset 26px 0 30px -20px rgba(60,40,20,.45); }
.leaf { position: absolute; left: 560px; top: 0; width: 560px; height: 660px; transform-origin: 0 50%; transform-style: preserve-3d; z-index: 3; }
.leaf .f, .leaf .b { position: absolute; inset: 0; backface-visibility: hidden; overflow: hidden; }
.leaf .b { transform: rotateY(180deg); }
.leaf .sh { position: absolute; inset: 0; background: linear-gradient(90deg, rgba(0,0,0,0), rgba(0,0,0,.35)); opacity: 0; pointer-events: none; }
.spine { position: absolute; left: 557px; top: 0; width: 6px; height: 660px; background: linear-gradient(90deg, #b9ab88, #8a7a5a, #b9ab88); z-index: 4; }
/* left page: the sleeve with its record peeking out */
.lp { position: absolute; inset: 0; padding: 40px 44px 0 50px; }
.no { font: 400 30px/1 "BK Head", serif; color: var(--red); }
.sleeve { position: relative; width: 300px; height: 300px; margin: 90px 0 0 66px; }
.sleeve::before, .sl::before { content: ""; position: absolute; left: 8%; right: 8%; top: 0; aspect-ratio: 1; border-radius: 50%;
  background: radial-gradient(circle, #e9e1c9 0 3%, #c8321f 3.2% 15%, #1a1512 15.5% 16.5%, #23201c 17% 30%, #1a1512 30.5% 31%, #23201c 31.5% 46%, #1a1512 46.5% 47%, #262320 47.5% 70%);
  transform: translateY(-22%); box-shadow: 0 2px 4px rgba(0,0,0,.4); }
.sleeve img { position: relative; width: 100%; height: 100%; object-fit: cover; transform: rotate(-1.2deg); box-shadow: 0 2px 0 rgba(0,0,0,.3), 0 8px 18px rgba(0,0,0,.3); }
.lp h2 { margin-top: 28px; font: 700 32px/1.12 "BK Serif", serif; text-wrap: balance; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.lp .who { margin-top: 6px; font-style: italic; font-size: 22px; color: var(--ink2); line-height: 1.25; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.lp .yr { margin-top: 2px; font-size: 21px; color: var(--dim); }
/* right page: jukebox title strips, two songs to a strip */
.rp { position: absolute; inset: 0; padding: 40px 40px 0 44px; }
.rp .hd { font: italic 22px/1 "BK Serif", serif; color: var(--ink2); display: flex; justify-content: space-between; }
.strips { margin-top: 18px; display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.st { background: linear-gradient(#f7ecc0, #efdfa6); border: 1px solid #b9a671; height: 86px; display: grid; grid-template-rows: 1fr 18px 1fr; align-items: center;
  font: 600 15px/1 "DejaVu Sans Condensed", "Arial Narrow", "Roboto Condensed", sans-serif; text-transform: uppercase; letter-spacing: .03em; color: #2a2218; box-shadow: 0 1px 0 rgba(0,0,0,.2); }
.st.blank { opacity: .55; }
.st > div { display: flex; gap: 7px; padding: 0 9px; white-space: nowrap; overflow: hidden; }
.st b { color: var(--red); flex: none; }
.st i { font-style: normal; overflow: hidden; }
.st .ru { height: 18px; border-top: 2px solid var(--red); border-bottom: 2px solid var(--red); font: italic 12px/14px "BK Serif", serif; text-transform: none; letter-spacing: 0; color: var(--red); padding: 0 9px; }
.st .on { background: var(--honey); color: #1a120a; margin: 0 4px; padding: 5px; }
.st.lit { box-shadow: 0 0 0 3px var(--honey), 0 0 26px 6px rgba(227,169,47,.7); }
.st.blink { animation: blink .5s 6 alternate; }
@keyframes blink { to { box-shadow: 0 0 0 3px var(--red), 0 0 8px 2px rgba(200,50,31,.5); } }

/* now playing */
.np { position: absolute; left: 1240px; top: 36px; width: 620px; height: 810px; padding: 34px 40px; transform: rotate(.4deg); }
.np .lb { font: italic 26px/1 "BK Serif", serif; color: var(--ink2); }
.np .art { position: relative; width: 540px; height: 290px; margin-top: 18px; }
.np .art .disc { position: absolute; left: 130px; top: 13px; width: 264px; height: 264px; transition: left .9s cubic-bezier(.2,.8,.3,1); }
.np .art.out .disc { left: 206px; }
.np .art img.cv { position: absolute; left: 0; top: 0; width: 290px; height: 290px; object-fit: cover; box-shadow: 0 2px 0 rgba(0,0,0,.3), 0 10px 20px rgba(0,0,0,.35); z-index: 2; background: #d8ceb2; }
.np .art.idle img.cv { object-fit: contain; padding: 30px; background: #efe6cf; }
.np h3 { margin-top: 24px; font: 400 44px/1.02 "BK Head", serif; text-wrap: balance; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.np .who { margin-top: 8px; font-size: 24px; font-style: italic; color: var(--ink2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.np .al { margin-top: 4px; font-size: 21px; color: var(--dim); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tag { display: inline-block; margin-top: 16px; background: var(--red); color: #fff6e6; font-size: 28px; padding: 8px 18px 10px; transform: rotate(-1.5deg); box-shadow: 0 3px 0 rgba(0,0,0,.25); white-space: nowrap; max-width: 100%; overflow: hidden; text-overflow: ellipsis; }
.tag.plain { background: var(--ink); }
.np .msg { display: block; margin-top: 12px; font: italic 23px/1.3 "BK Serif", serif; color: var(--ink2); quotes: none; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.np .msg[hidden] { display: none; }
.bar { margin-top: 20px; height: 7px; background: #cdbf9f; } .bar i { display: block; height: 100%; width: 0; background: var(--red); }
.np .nx { margin-top: 18px; border-top: 2px solid var(--ink); padding-top: 10px; }
.np .nx .lb { font-size: 22px; }
.np .nx div.q { font-size: 23px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-top: 6px; }
.np .nx div.q b { color: var(--red); font-family: "DejaVu Sans Condensed", "Arial Narrow", sans-serif; font-size: 19px; margin-right: 12px; }
.np .nx div.q em { color: var(--red); }
.np .nx .none { font-style: italic; color: var(--dim); font-size: 21px; margin-top: 6px; }

/* a record: the cover is its label, and it spins while a song plays */
.disc { border-radius: 50%; background: radial-gradient(circle, #0000 0 31%, #151210 31.5% 33%, #262320 33.5% 45%, #151210 45.5% 46%, #2a2622 46.5% 60%, #151210 60.5% 61%, #262320 61.5% 98%, #0d0b0a 98.5%);
  box-shadow: 0 6px 16px rgba(0,0,0,.45); }
.disc .lab { position: absolute; inset: 30%; border-radius: 50%; overflow: hidden; background: var(--red); animation: spin 1.8s linear infinite; }
.disc .lab img { width: 100%; height: 100%; object-fit: cover; }
.disc .lab::after { content: ""; position: absolute; left: 46%; top: 46%; width: 8%; height: 8%; border-radius: 50%; background: #e9e1c9; }
.disc .grv { position: absolute; inset: 0; border-radius: 50%; animation: spin 1.8s linear infinite;
  background: conic-gradient(from 0deg, #fff0 0 8%, #ffffff1c 12%, #fff0 16% 58%, #ffffff12 62%, #fff0 66%); }
.disc .gl { position: absolute; inset: 0; border-radius: 50%; background: conic-gradient(from 200deg, #fff0 0 30%, #ffffff26 38%, #fff0 46% 80%, #ffffff1a 88%, #fff0 96%); }
.np .art.idle .lab, .np .art.idle .grv { animation-play-state: paused; }
@keyframes spin { to { transform: rotate(360deg); } }

/* the shelf along the bottom: every album, the one in the book lifted up */
.shelf { position: absolute; left: 0; right: 0; bottom: 0; height: 200px; }
.row { position: absolute; left: 0; bottom: 44px; display: flex; gap: 26px; padding-left: 60px; transition: transform .9s cubic-bezier(.3,.7,.3,1); }
.sl { position: relative; width: 120px; height: 120px; flex: none; transition: transform .5s; }
.sl::before { transform: translateY(-14%); box-shadow: none; }
.sl img { position: relative; width: 100%; height: 100%; object-fit: cover; box-shadow: 0 4px 10px rgba(0,0,0,.4); background: #d8ceb2; }
.sl:nth-child(odd) img { transform: rotate(-1.4deg); } .sl:nth-child(even) img { transform: rotate(1.1deg); }
.sl.cur { transform: translateY(-18px); }
.sl.cur img { outline: 4px solid var(--honey); }
.ledge { position: absolute; left: 0; right: 0; bottom: 0; height: 46px; background: linear-gradient(#7a5233, #5a3a22 40%, #3c2514); box-shadow: 0 -4px 10px rgba(0,0,0,.35); }
.ledge::before { content: ""; position: absolute; left: 0; right: 0; top: 0; height: 6px; background: #8d6340; }

/* a request pops up */
.pop { position: absolute; inset: 0; z-index: 20; display: grid; place-items: center; background: rgba(20,14,10,0); pointer-events: none; transition: background .6s; }
.pop.on { background: rgba(20,14,10,.62); }
.pcard { position: relative; width: 1120px; height: 860px; opacity: 0; transform: scale(.4) rotate(-6deg); transition: transform .8s cubic-bezier(.2,1.5,.35,1), opacity .4s; }
.pop.on .pcard { opacity: 1; transform: none; }
.pop.off .pcard { opacity: 0; transform: scale(.3) translate(1300px,-500px); transition: transform .8s cubic-bezier(.6,0,.8,.4), opacity .8s ease-in; }
.pcard .disc { position: absolute; left: 140px; top: 40px; width: 560px; height: 560px; transition: left 1.1s .55s cubic-bezier(.2,.8,.3,1); }
.pop.on .pcard .disc { left: 440px; }
.pcard img.cv { position: absolute; left: 40px; top: 20px; width: 600px; height: 600px; object-fit: cover; z-index: 2; background: #d8ceb2;
  box-shadow: 0 4px 0 rgba(0,0,0,.3), 0 24px 50px rgba(0,0,0,.55); transform: rotate(-1.5deg); }
.pcard .cap { position: absolute; left: 40px; right: 0; top: 640px; color: #f6eedb; }
.pcard .cap > div { margin-top: 14px; }
.pcard .cap .tag { font-size: 34px; margin: 0; }
.pcard .cap h4 { font: 400 52px/1 "BK Head", serif; text-shadow: 0 3px 10px #000a; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.pcard .cap q { display: block; margin-top: 14px; font: italic 36px/1.2 "BK Serif", serif; color: #fff6e6; quotes: none; }
.pcard .cap span { display: block; margin-top: 6px; font-size: 28px; font-style: italic; color: #e7d8b5; }

/* sound-off notice: only shows when a normal browser blocks sound until a click (OBS never does) */
#tap { position: absolute; left: 50%; top: 50%; transform: translate(-50%,-50%); z-index: 99; display: none; background: var(--red); color: #fff;
  font: 400 40px/1 "BK Head", serif; padding: 24px 40px; border: 0; cursor: pointer; }
@media (prefers-reduced-motion: reduce) { .disc .lab, .disc .grv { animation: none; } }
</style>
</head>
<body>
  <header class="paper mast"><img src="art/logo-mark.png" alt=""><div><h1>The Jukebox</h1><div class="sub">on The Bee's Knees.fm</div></div>
    <p id="mq">Pick a song at<b>thebeesknees.fm/jukebox</b></p></header>

  <div class="book" id="book">
    <div class="pg l paper" id="pl"></div><div class="pg r paper" id="pr"></div>
    <div class="spine"></div>
    <div class="leaf" id="leaf" hidden><div class="f paper"></div><div class="b paper"></div></div>
  </div>

  <section class="np paper">
    <div class="lb">Now playing</div>
    <div class="art idle" id="art"><div class="disc"><div class="grv"></div><div class="lab"><img id="lab" alt=""></div><div class="gl"></div></div><img class="cv" id="cov" src="art/logo-mark.png" alt=""></div>
    <h3 id="t">Make your selection</h3><div class="who" id="a"></div><div class="al" id="al"></div>
    <div class="tag plain" id="req" hidden></div>
    <q class="msg" id="msg" hidden></q>
    <div class="bar"><i id="bar"></i></div>
    <div class="nx"><div class="lb">Up next</div><div id="queue"></div></div>
  </section>

  <div class="shelf"><div class="row" id="row"></div><div class="ledge"></div></div>

  <div class="pop" id="pop"><div class="pcard">
    <div class="disc"><div class="grv"></div><div class="lab"><img id="plab" alt=""></div><div class="gl"></div></div>
    <img class="cv" id="pcov" alt="">
    <div class="cap"><div class="tag" id="ptag"></div><div><h4 id="pt"></h4><span id="pa"></span><q id="pm" hidden></q></div></div>
  </div></div>

  <button id="tap" type="button">Click to turn the sound on</button>
  <audio id="au" preload="auto"></audio>

<script src="config.js?v=20261110st"></script>
<script src="art/jukebox/catalog.js?v=2"></script>
<script src="art/jukebox/jukebox-net.js?v=4"></script>
<script>
(function () {
  "use strict";
  var J = window.BKJ, Q = new URLSearchParams(location.search), $ = function (id) { return document.getElementById(id); };
  var SECRET = (Q.get("dj") || "").trim();
  var MAXQ = 25;
  var A = J.albums();                                   // albums on the jukebox today, in number order
  var S = { accepting: true, auto: Q.get("auto") === "1", fill: Q.get("fill") === "1" };
  var queue = [];        // [{id, n, i, name, cid, ok}] ok = approved by the DJ
  var now = null;        // {id, n, i, name, started}
  var pub = null, dj = null;
  var au = $("au");

  // pick up where we left off if OBS reloads the page mid-show
  try { var saved = JSON.parse(localStorage.getItem("bkj-state") || "null"); if (saved) { queue = saved.queue || []; ["accepting", "auto", "fill"].forEach(function (k) { if (k in (saved.s || {})) S[k] = saved.s[k]; }); } } catch (e) {}
  if (Q.has("auto")) S.auto = Q.get("auto") === "1";
  if (Q.has("fill")) S.fill = Q.get("fill") === "1";
  function save() { try { localStorage.setItem("bkj-state", JSON.stringify({ queue: queue, s: S })); } catch (e) {} }

  /* ---------- the card book: one album to a spread (a long record takes two) ---------- */
  var SP = []; A.forEach(function (a) { for (var s = 0; s < a.songs.length; s += 24) SP.push({ a: a, from: s }); });
  if (!SP.length) SP.push({ a: { n: 0, title: "", artist: "", songs: [], cover: "" }, from: 0 });
  var cur = 0, turning = false;
  function isNow(a, i) { return now && now.n === a.n && now.i === i; }
  function left(sp) {
    var a = sp.a;
    return '<div class="lp"><div class="no">No. ' + a.n + (sp.from ? " (continued)" : "") + '</div><div class="sleeve"><img src="' + J.esc(a.cover) + '" alt=""></div><h2>' + J.esc(a.title) +
      '</h2><div class="who">' + J.esc(a.artist) + '</div><div class="yr">' + J.esc(a.year || "") + "</div></div>";
  }
  function right(sp) {
    var a = sp.a, h = '<div class="rp"><div class="hd"><span>Ask for a song by its number</span><span>' + a.songs.length + ' songs</span></div><div class="strips">';
    for (var k = 0; k < 12; k++) {
      var i = sp.from + k * 2;
      if (i >= a.songs.length) { h += '<div class="st blank"></div>'; continue; }
      var has2 = i + 1 < a.songs.length, on1 = isNow(a, i), on2 = has2 && isNow(a, i + 1);
      h += '<div class="st' + (on1 || on2 ? " lit" : "") + '"><div' + (on1 ? ' class="on"' : "") + "><b>" + J.code(a.n, i) + "</b><i>" + J.esc(a.songs[i].t) + '</i></div><div class="ru">' + J.esc(a.artist) +
        "</div><div" + (on2 ? ' class="on"' : "") + ">" + (has2 ? "<b>" + J.code(a.n, i + 1) + "</b><i>" + J.esc(a.songs[i + 1].t) + "</i>" : "") + "</div></div>";
    }
    return h + "</div></div>";
  }
  // long song titles get smaller type so they fit their strip
  function fit(root) { root.querySelectorAll(".st i").forEach(function (e) { var f = 15; while (e.scrollWidth > e.clientWidth + 1 && f > 10) { f -= .5; e.style.fontSize = f + "px"; } }); }
  function show(p, blink) {
    cur = p; $("pl").innerHTML = left(SP[p]); $("pr").innerHTML = right(SP[p]); fit($("book")); shelf();
    if (blink) { var l = $("pr").querySelector(".st.lit"); if (l) l.classList.add("blink"); }
  }
  function turn(to, ms, done) {
    var leaf = $("leaf"), f = leaf.querySelector(".f"), b = leaf.querySelector(".b");
    f.innerHTML = right(SP[cur]) + '<div class="sh"></div>'; b.innerHTML = left(SP[to]);
    $("pr").innerHTML = right(SP[to]); fit($("book"));
    leaf.hidden = false; leaf.style.transition = "none"; leaf.style.transform = "rotateY(0)"; leaf.offsetWidth;
    leaf.style.transition = "transform " + ms + "ms cubic-bezier(.45,.05,.35,1)"; leaf.style.transform = "rotateY(-180deg)";
    var sh = f.querySelector(".sh"); sh.style.transition = "opacity " + ms / 2 + "ms"; sh.style.opacity = 1;
    cur = to; shelf();
    setTimeout(function () { leaf.hidden = true; $("pl").innerHTML = left(SP[to]); fit($("book")); done && done(); }, ms + 30);
  }
  // riffle to a spread: quick page turns through the albums in between (at most 8), landing on the right one
  function goTo(p, done) {
    if (turning) return setTimeout(function () { goTo(p, done); }, 350);
    if (p === cur) { show(cur, true); return done && done(); }
    turning = true;
    var dist = (p - cur + SP.length) % SP.length, steps = Math.min(dist, 8), path = [];
    for (var k = 1; k < steps; k++) path.push((cur + Math.round(dist * k / steps)) % SP.length);
    path.push(p);
    (function next() {
      if (!path.length) { turning = false; show(cur, true); return done && done(); }
      var to = path.shift(); turn(to, path.length ? 300 : 1100, next);
    })();
  }
  function browse() { if (turning || popping) return; turning = true; turn((cur + 1) % SP.length, 1300, function () { turning = false; }); }
  function spreadOf(n, i) { for (var k = 0; k < SP.length; k++) if (SP[k].a.n === n && i >= SP[k].from && i < SP[k].from + 24) return k; return 0; }
  // the shelf follows the book
  $("row").innerHTML = A.map(function (a) { return '<div class="sl"><img src="' + J.esc(a.cover) + '" alt=""></div>'; }).join("");
  function shelf() {
    var ai = A.indexOf(SP[cur].a), els = $("row").children;
    for (var k = 0; k < els.length; k++) els[k].classList.toggle("cur", k === ai);
    $("row").style.transform = "translateX(" + Math.min(0, -(ai * 146) + 760) + "px)";
  }
  show(0);

  /* ---------- Now playing, Up next and the masthead ---------- */
  var shownNow = "";
  function paint() {
    var key = now ? now.id : "";
    if (key !== shownNow) {
      shownNow = key;
      var art = $("art"); art.classList.remove("out");
      setTimeout(function () {
        if (shownNow !== key) return;   // something else started in the meantime
        if (now) {
          var f = J.find(now.n, now.i);
          $("cov").src = f.album.cover; $("lab").src = f.album.cover;
          $("t").textContent = f.song.t; $("a").textContent = f.album.artist;
          $("al").textContent = f.album.title + (f.album.year ? ", " + f.album.year : "") + "  ·  " + J.code(now.n, now.i);
          var r = $("req"); r.hidden = false; r.className = now.name ? "tag" : "tag plain";
          r.innerHTML = now.name ? "Requested by <b>" + J.esc(now.name) + "</b>" : "The jukebox's pick";
          $("msg").textContent = now.msg ? "\u201C" + now.msg + "\u201D" : ""; $("msg").hidden = !now.msg;
          art.className = "art out";
        } else {
          $("cov").src = "art/logo-mark.png"; $("lab").removeAttribute("src");
          $("t").textContent = S.accepting ? "Make your selection" : "Requests are closed";
          $("a").textContent = S.accepting ? "Pick a song at thebeesknees.fm/jukebox" : ""; $("al").textContent = ""; $("req").hidden = true; $("msg").hidden = true;
          art.className = "art idle";
        }
      }, now ? 600 : 0);
    }
    if (!now) { $("t").textContent = S.accepting ? "Make your selection" : "Requests are closed"; $("a").textContent = S.accepting ? "Pick a song at thebeesknees.fm/jukebox" : ""; }
    var up = queue.filter(function (r) { return r.ok; });
    $("queue").innerHTML = up.length ? up.slice(0, 3).map(function (r) {
      var f = J.find(r.n, r.i); return '<div class="q"><b>' + J.code(r.n, r.i) + "</b>" + J.esc(f ? f.song.t : "") + (r.name ? "  <em>for " + J.esc(r.name) + "</em>" : "") + "</div>";
    }).join("") : '<div class="none">' + (S.accepting ? "Nothing yet. Pick a song!" : "Requests are closed for now.") + "</div>";
    $("mq").innerHTML = S.accepting ? "Pick a song at<b>thebeesknees.fm/jukebox</b>" : "Requests are<b>closed for now</b>";
  }

  /* ---------- a request pops up when it goes in line ---------- */
  var pops = [], popping = false;
  function popup(r) { if (r.name && !r.popped) { r.popped = true; pops.push(r); nextPop(); } }
  function nextPop() {
    if (popping || !pops.length) return;
    var r = pops.shift(), f = J.find(r.n, r.i); if (!f) return nextPop();
    popping = true;
    $("pcov").src = f.album.cover; $("plab").src = f.album.cover;
    $("pt").textContent = J.code(r.n, r.i) + "  " + f.song.t; $("pa").textContent = f.album.artist; $("pm").textContent = r.msg ? "\u201C" + r.msg + "\u201D" : ""; $("pm").hidden = !r.msg;
    $("ptag").innerHTML = "Requested by <b>" + J.esc(r.name) + "</b>";
    var p = $("pop"); p.className = "pop"; p.offsetWidth; p.className = "pop on";
    setTimeout(function () {
      p.className = "pop on off";
      setTimeout(function () { p.className = "pop"; popping = false; goTo(spreadOf(r.n, r.i), function () { lastTurn = Date.now(); }); setTimeout(nextPop, 2500); }, 900);
    }, 6200);
  }

  /* ---------- playing ---------- */
  var stopAt = 0;
  function play(r) {
    var f = J.find(r.n, r.i);
    if (!f) { now = null; return pump(); }
    now = { id: r.id, n: r.n, i: r.i, name: r.name, msg: r.msg || "", started: Date.now() };
    paint(); share();
    if (!popping) goTo(spreadOf(r.n, r.i), function () { lastTurn = Date.now(); });
    var url = J.fileUrl(f.album, f.song), s = f.song.s || 0;
    stopAt = f.song.d ? s + f.song.d : 0;
    au.src = url;
    au.onloadedmetadata = function () { if (s) try { au.currentTime = s; } catch (e) {} };
    var p = au.play(); if (p && p.catch) p.catch(function () { $("tap").style.display = "block"; });
  }
  function finish() { now = null; au.pause(); au.removeAttribute("src"); try { au.load(); } catch (e) {} $("bar").style.width = "0"; paint(); share(); show(cur); setTimeout(pump, 1500); }
  au.addEventListener("ended", finish);
  au.addEventListener("error", function () { if (now) setTimeout(finish, 1500); });
  au.addEventListener("timeupdate", function () {
    if (!now) return;
    var f = J.find(now.n, now.i); if (!f) return;
    var s = f.song.s || 0, d = f.song.d || au.duration || 1;
    $("bar").style.width = Math.min(100, Math.max(0, (au.currentTime - s) / d * 100)) + "%";
    if (stopAt && au.currentTime >= stopAt - 0.25) finish();   // songs inside a whole LP side stop where the next song begins
  });
  $("tap").onclick = function () { this.style.display = "none"; au.play(); };
  // start the next approved song (or, with "fill", one the jukebox picks)
  function pump() {
    if (now) return;
    var k = queue.findIndex(function (r) { return r.ok; });
    if (k >= 0) { var r = queue.splice(k, 1)[0]; save(); return play(r); }
    if (S.fill && A.length) {
      var a = A[Math.floor(Math.random() * A.length)];
      return play({ id: J.uid(), n: a.n, i: Math.floor(Math.random() * a.songs.length), name: "" });
    }
    paint(); share();
  }

  /* ---------- requests ---------- */
  function request(m, from) {
    var reply = function (ok, msg, pos) { J.send(pub, "ack", { id: m.id, cid: m.cid, ok: ok, msg: msg, pos: pos }); };
    if (!S.accepting && from !== "dj") return reply(false, "The jukebox isn't taking requests right now.");
    var f = J.find(m.n, m.i); if (!f) return reply(false, "That song isn't on the jukebox.");
    if (from !== "dj" && J.rude(m.name)) return reply(false, "That username can't go on screen. Try another one.");
    if (J.rude(m.msg)) m.msg = "";   // the song still goes in; the message doesn't
    if (from !== "dj") {
      if (queue.some(function (r) { return r.cid && r.cid === m.cid; })) return reply(false, "You already have a song waiting. Once it plays, you can pick another.");
      if (queue.length >= MAXQ) return reply(false, "The line is full. Try again in a few minutes.");
      if (queue.some(function (r) { return r.n === +m.n && r.i === +m.i; }) || (now && now.n === +m.n && now.i === +m.i)) return reply(false, "Someone already asked for that one. It's coming up!");
    }
    var r = { id: m.id || J.uid(), n: +m.n, i: +m.i, name: from === "dj" ? (m.name || "") : J.cleanName(m.name), msg: J.cleanMsg(m.msg), cid: m.cid || "", ok: from === "dj" || S.auto };
    queue.push(r); save();
    reply(true, r.ok ? "You're in line!" : "Sent! The DJ will put it on soon.", queue.filter(function (x) { return x.ok; }).indexOf(r) + 1);
    if (r.ok) popup(r);
    paint(); share(); pump();
  }

  /* ---------- talking to the website and the control panel ---------- */
  function publicState() {
    return { accepting: S.accepting, now: now ? { n: now.n, i: now.i, name: now.name } : null,
      queue: queue.filter(function (r) { return r.ok; }).slice(0, 10).map(function (r) { return { n: r.n, i: r.i, name: r.name }; }),
      waiting: queue.filter(function (r) { return !r.ok; }).length };
  }
  var shareTimer = null;
  function share() {
    clearTimeout(shareTimer);
    shareTimer = setTimeout(function () {
      J.send(pub, "state", publicState());
      J.send(dj, "dj", { s: S, now: now, queue: queue, pos: au.currentTime, at: Date.now() });
    }, 150);
  }
  setInterval(share, 10000);
  J.join("jukebox", {
    request: function (m) { request(m, "web"); },
    hello: function () { share(); }
  }, { key: "booth-" + J.uid(), me: { role: "booth", accepting: S.accepting } }, function (ch) { pub = ch; share(); });
  if (SECRET) J.join("jukebox-dj-" + SECRET, {
    cmd: function (c) {
      var k = queue.findIndex(function (r) { return r.id === c.id; });
      if (c.cmd === "approve" && k >= 0) { queue[k].ok = true; popup(queue[k]); pump(); }
      else if (c.cmd === "remove" && k >= 0) queue.splice(k, 1);
      else if (c.cmd === "playnow" && k >= 0) { var r = queue.splice(k, 1)[0]; r.ok = true; popup(r); queue.unshift(r); if (now) finish(); else pump(); }
      else if (c.cmd === "up" && k > 0) { var x = queue.splice(k, 1)[0]; queue.splice(k - 1, 0, x); }
      else if (c.cmd === "skip") { if (now) finish(); }
      else if (c.cmd === "add") request({ n: c.n, i: c.i, name: c.name || "", id: J.uid() }, "dj");
      else if (c.cmd === "set") { ["accepting", "auto", "fill"].forEach(function (key) { if (key in c) S[key] = !!c[key]; });
        if (S.auto) queue.forEach(function (r) { if (!r.ok) { r.ok = true; popup(r); } }); if (pub) pub.track({ role: "booth", accepting: S.accepting }); pump(); }
      else if (c.cmd === "clear") queue = [];
      else if (c.cmd === "volume") au.volume = Math.max(0, Math.min(1, +c.v));
      save(); paint(); share();
    },
    hello: function () { share(); }
  }, {}, function (ch) { dj = ch; share(); });

  /* ---------- slow browsing between requests ---------- */
  var lastTurn = Date.now();
  setInterval(function () {
    if (turning || popping) return;
    // while a song plays, the book stays on its album (and goes back to it after 20 seconds if it wandered)
    if (now) { var p = spreadOf(now.n, now.i); if (p !== cur && Date.now() - lastTurn > 20000) { goTo(p); lastTurn = Date.now(); } return; }
    if (Date.now() - lastTurn > 6500) { browse(); lastTurn = Date.now(); }
  }, 1000);
  paint(); pump();
  window.BKJ_STATE = function () { return { S: S, queue: queue, now: now, cur: cur }; };   // for checking things from the console
})();
</script>
</body>
</html>
